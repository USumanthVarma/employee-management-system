# Test-only overrides: in-memory H2 so `mvn test` never needs MySQL running.
spring.datasource.url=jdbc:h2:mem:ems_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
app.jwt.secret=test-only-secret-key-not-used-for-anything-real-1234567890
app.jwt.expiration-ms=3600000
