# ============================================================
# Common settings (apply no matter which profile is active)
# ============================================================
spring.application.name=employee-management-system
server.port=8080

# Active profile selects the datasource:
#   mysql -> application-mysql.properties (default, matches the curriculum's DBMS module)
#   h2    -> application-h2.properties     (zero-install quick start, in-memory)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT - override app.jwt.secret via an environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:ThisIsADemoOnlySecretKeyForEMS-ChangeMeInProduction-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dates as plain "yyyy-MM-dd" instead of arrays/timestamps in JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Return a clean 404 instead of a stack trace for unmapped URLs
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
