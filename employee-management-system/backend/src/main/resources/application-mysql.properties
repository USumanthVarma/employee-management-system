# ============================================================
# MySQL profile - Module 4 of the curriculum (DBMS & SQL)
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create-drop rebuilds the schema AND re-runs data.sql every time the app
# starts - predictable while you are learning/demoing. Once you want data
# to survive a restart, switch this to "update" and set
# spring.sql.init.mode=never below (otherwise data.sql will try to
# re-insert rows that already exist).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
