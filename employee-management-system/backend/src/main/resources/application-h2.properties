# ============================================================
# H2 profile - in-memory DB, nothing to install. Run with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Console (while the app is running): http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:ems_db   User: sa   Password: (blank)
# ============================================================
spring.datasource.url=jdbc:h2:mem:ems_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
